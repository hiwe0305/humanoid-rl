# configs/train.yaml — Master Hydra config

defaults:
  - robot: h1           # Mặc định dùng H1 (PD control) — generic humanoid cần override
  - task: walk          # "walk" | "run" | "stair" | "jump"
  - algo: ppo
  - _self_

# Training settings
train:
  total_steps: 10_000_000
  use_gpu: true
  save_every: 100
  eval_every: 50

# Environment settings
env:
  frame_skip: 5

# Data collection settings
collector:
  n_episodes: 200
  n_envs: 8
  output_dir: data/raw
  save_every: 50
  policy_checkpoint: null
